<!doctype html>
<html lang="th" data-theme="fresh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Personal Wealth Dashboard" />
    <link rel="icon" href="data:," />
    <title>Personal Wealth</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/records.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/monthly-finance.css" />
    <link rel="stylesheet" href="css/annual-report.css" />
    <link rel="stylesheet" href="css/goals.css" />
    <link rel="stylesheet" href="css/onboarding.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/animation.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="เมนูหลัก">
        <a class="brand" href="#dashboard">
          <span class="brand__mark" data-icon="circle-dollar-sign"></span>
          <span>Personal Wealth</span>
        </a>
        <nav class="sidebar-nav" data-desktop-nav></nav>
        <div class="sidebar__profile">
          <span class="avatar" data-profile-initials aria-hidden="true">U</span>
          <span class="sidebar__profile-copy">
            <span class="sidebar__profile-name" data-profile-name>ผู้ใช้</span>
            <span class="sidebar__profile-meta"><span data-profile-currency>THB</span> · Personal</span>
          </span>
        </div>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <h1 class="topbar__title" data-topbar-title>Dashboard</h1>
          <div class="topbar__actions">
            <button class="icon-button" type="button" data-privacy-toggle aria-pressed="false">
              <span data-icon="eye-off"></span>
              <span class="visually-hidden" data-privacy-label>ซ่อนยอดเงิน</span>
            </button>
            <button class="icon-button" type="button" data-auth-logout aria-label="ออกจากระบบ" title="ออกจากระบบ" hidden>
              <span data-icon="log-out"></span>
            </button>
            <span class="avatar" data-profile-initials aria-label="บัญชีผู้ใช้">U</span>
          </div>
        </header>

        <main id="main-content" class="page" tabindex="-1" data-page></main>
      </div>

      <nav class="mobile-nav" aria-label="เมนูหลักบนมือถือ" data-mobile-nav></nav>
      <button class="mobile-quick-add" type="button" data-quick-add-open aria-label="เพิ่มรายการ" title="เพิ่มรายการ"><span data-icon="plus"></span></button>
    </div>

    <dialog class="dialog" data-asset-dialog aria-labelledby="asset-dialog-title">
      <form data-asset-form>
        <header class="dialog__header">
          <h2 id="asset-dialog-title" data-asset-dialog-title>เพิ่ม Asset</h2>
          <button class="icon-button" type="button" data-asset-close aria-label="ปิด">
            <span data-icon="x"></span>
          </button>
        </header>
        <div class="dialog__body">
          <input name="id" type="hidden" />
          <label class="field">
            <span class="field__label">ชื่อ Asset</span>
            <input class="field__input" name="name" autocomplete="off" required />
          </label>
          <label class="field">
            <span class="field__label">ประเภท</span>
            <select class="field__input" name="category" required>
              <option value="cash">Cash</option>
              <option value="bank-account">Bank Account</option>
              <option value="investment">Investment</option>
              <option value="stock">Stock</option>
              <option value="fund">Mutual Fund</option>
              <option value="crypto">Crypto</option>
              <option value="gold">Gold</option>
              <option value="property">Property</option>
              <option value="vehicle">Vehicle</option>
              <option value="business">Business</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">มูลค่าปัจจุบัน</span>
            <input class="field__input" name="value" type="number" min="0" inputmode="decimal" required />
          </label>
          <label class="field">
            <span class="field__label">สถาบัน</span>
            <input class="field__input" name="institution" autocomplete="organization" />
          </label>
          <label class="field">
            <span class="field__label">สภาพคล่อง</span>
            <select class="field__input" name="liquidity">
              <option value="high">สูง</option>
              <option value="medium">ปานกลาง</option>
              <option value="low">ต่ำ</option>
            </select>
          </label>
          <p class="field__error" role="alert" data-asset-form-error hidden></p>
        </div>
        <footer class="dialog__footer">
          <button class="button button--secondary" type="button" data-asset-close>ยกเลิก</button>
          <button class="button" type="submit">บันทึก</button>
        </footer>
      </form>
    </dialog>

    <dialog class="dialog" data-liability-dialog aria-labelledby="liability-dialog-title">
      <form data-liability-form>
        <header class="dialog__header">
          <h2 id="liability-dialog-title" data-liability-dialog-title>เพิ่ม Liability</h2>
          <button class="icon-button" type="button" data-liability-close aria-label="ปิด">
            <span data-icon="x"></span>
          </button>
        </header>
        <div class="dialog__body">
          <input name="id" type="hidden" />
          <label class="field">
            <span class="field__label">ชื่อหนี้</span>
            <input class="field__input" name="name" autocomplete="off" required />
          </label>
          <label class="field">
            <span class="field__label">ประเภทหนี้</span>
            <select class="field__input" name="category" required>
              <option value="credit-card">Credit Card</option>
              <option value="home-loan">Home Loan</option>
              <option value="car-loan">Car Loan</option>
              <option value="personal-loan">Personal Loan</option>
              <option value="education-loan">Education Loan</option>
              <option value="business-loan">Business Loan</option>
              <option value="other-debt">Other Debt</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">ยอดหนี้เริ่มต้น</span>
            <input class="field__input" name="originalAmount" type="number" min="0" required />
          </label>
          <label class="field">
            <span class="field__label">ยอดคงเหลือ</span>
            <input class="field__input" name="currentBalance" type="number" min="0" required />
          </label>
          <label class="field">
            <span class="field__label">ดอกเบี้ยต่อปี (%)</span>
            <input class="field__input" name="interestRate" type="number" min="0" step="0.01" />
          </label>
          <label class="field">
            <span class="field__label">ยอดชำระต่อเดือน</span>
            <input class="field__input" name="monthlyPayment" type="number" min="0" />
          </label>
          <label class="field">
            <span class="field__label">สถาบัน</span>
            <input class="field__input" name="institution" autocomplete="organization" />
          </label>
          <p class="field__error" role="alert" data-liability-form-error hidden></p>
        </div>
        <footer class="dialog__footer">
          <button class="button button--secondary" type="button" data-liability-close>ยกเลิก</button>
          <button class="button" type="submit">บันทึก</button>
        </footer>
      </form>
    </dialog>

    <dialog class="dialog" data-quick-dialog aria-labelledby="quick-dialog-title">
      <form data-quick-form>
        <header class="dialog__header">
          <h2 id="quick-dialog-title" data-quick-title>อัปเดตมูลค่า</h2>
          <button class="icon-button" type="button" data-quick-close aria-label="ปิด">
            <span data-icon="x"></span>
          </button>
        </header>
        <div class="dialog__body">
          <input name="entityType" type="hidden" />
          <input name="id" type="hidden" />
          <p class="quick-current" data-quick-current></p>
          <label class="field">
            <span class="field__label">ยอดใหม่</span>
            <input class="field__input" name="value" type="number" min="0" required />
          </label>
          <p class="field__error" role="alert" data-quick-form-error hidden></p>
        </div>
        <footer class="dialog__footer">
          <button class="button button--secondary" type="button" data-quick-close>ยกเลิก</button>
          <button class="button" type="submit">อัปเดต</button>
        </footer>
      </form>
    </dialog>

    <dialog class="dialog dialog--wide" data-history-dialog aria-labelledby="history-dialog-title">
      <header class="dialog__header">
        <h2 id="history-dialog-title" data-history-title>ประวัติมูลค่า</h2>
        <button class="icon-button" type="button" data-history-close aria-label="ปิด">
          <span data-icon="x"></span>
        </button>
      </header>
      <div class="dialog__body" data-history-body></div>
    </dialog>

    <dialog class="dialog" data-transaction-dialog aria-labelledby="transaction-dialog-title">
      <form data-transaction-form>
        <header class="dialog__header">
          <h2 id="transaction-dialog-title">เพิ่มรายการ</h2>
          <button class="icon-button" type="button" data-transaction-close aria-label="ปิด">
            <span data-icon="x"></span>
          </button>
        </header>
        <div class="dialog__body">
          <label class="field"><span class="field__label">ประเภทรายการ</span>
            <select class="field__input" name="type" required>
              <option value="expense">รายจ่าย</option>
              <option value="income">รายรับ</option>
              <option value="transfer">เงินออม/ลงทุน</option>
            </select>
          </label>
          <label class="field"><span class="field__label">ชื่อรายการ</span>
            <input class="field__input" name="name" autocomplete="off" required />
          </label>
          <label class="field"><span class="field__label">หมวดหมู่</span>
            <input class="field__input" name="category" autocomplete="off" required />
          </label>
          <label class="field"><span class="field__label">จำนวนเงิน</span>
            <input class="field__input" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required />
          </label>
          <label class="field"><span class="field__label">วันที่</span>
            <input class="field__input" name="transactionDate" type="date" required />
          </label>
          <label class="field"><span class="field__label">หมายเหตุ</span>
            <input class="field__input" name="note" autocomplete="off" />
          </label>
          <p class="field__error" role="alert" hidden></p>
        </div>
        <footer class="dialog__footer">
          <button class="button button--secondary" type="button" data-transaction-close>ยกเลิก</button>
          <button class="button" type="submit">บันทึก</button>
        </footer>
      </form>
    </dialog>

    <dialog class="dialog" data-budget-dialog aria-labelledby="budget-dialog-title">
      <form data-budget-form>
        <header class="dialog__header">
          <h2 id="budget-dialog-title">วางแผนรายเดือน</h2>
          <button class="icon-button" type="button" data-budget-close aria-label="ปิด">
            <span data-icon="x"></span>
          </button>
        </header>
        <div class="dialog__body">
          <input name="month" type="hidden" />
          <label class="field"><span class="field__label">ประเภท</span>
            <select class="field__input" name="type" required>
              <option value="expense">รายจ่าย</option>
              <option value="income">รายรับ</option>
              <option value="transfer">เงินออม/ลงทุน</option>
            </select>
          </label>
          <label class="field"><span class="field__label">หมวดหมู่</span>
            <input class="field__input" name="category" autocomplete="off" required />
          </label>
          <label class="field"><span class="field__label">ยอดตามแผน</span>
            <input class="field__input" name="plannedAmount" type="number" min="0" step="0.01" required />
          </label>
          <p class="field__error" role="alert" hidden></p>
        </div>
        <footer class="dialog__footer">
          <button class="button button--secondary" type="button" data-budget-close>ยกเลิก</button>
          <button class="button" type="submit">บันทึกแผน</button>
        </footer>
      </form>
    </dialog>

    <dialog class="dialog" data-recurring-dialog aria-labelledby="recurring-dialog-title">
      <form data-recurring-form>
        <header class="dialog__header"><h2 id="recurring-dialog-title">เพิ่มรายการประจำ</h2>
          <button class="icon-button" type="button" data-recurring-close aria-label="ปิด"><span data-icon="x"></span></button></header>
        <div class="dialog__body">
          <label class="field"><span class="field__label">ประเภท</span><select class="field__input" name="type" required>
            <option value="expense">รายจ่าย</option><option value="income">รายรับ</option><option value="transfer">เงินออม/ลงทุน</option>
          </select></label>
          <label class="field"><span class="field__label">ชื่อรายการ</span><input class="field__input" name="name" required /></label>
          <label class="field"><span class="field__label">หมวดหมู่</span><input class="field__input" name="category" required /></label>
          <label class="field"><span class="field__label">จำนวนเงิน</span><input class="field__input" name="amount" type="number" min="0.01" step="0.01" required /></label>
          <label class="field"><span class="field__label">วันที่ของเดือน</span><input class="field__input" name="dayOfMonth" type="number" min="1" max="31" required /></label>
          <p class="field__error" role="alert" hidden></p>
        </div>
        <footer class="dialog__footer"><button class="button button--secondary" type="button" data-recurring-close>ยกเลิก</button>
          <button class="button" type="submit">บันทึกรายการประจำ</button></footer>
      </form>
    </dialog>

    <dialog class="dialog" data-reconciliation-dialog aria-labelledby="reconciliation-dialog-title">
      <form data-reconciliation-form>
        <header class="dialog__header"><h2 id="reconciliation-dialog-title">ตรวจยอดเงินสดปลายเดือน</h2>
          <button class="icon-button" type="button" data-reconciliation-close aria-label="ปิด"><span data-icon="x"></span></button></header>
        <div class="dialog__body">
          <label class="field"><span class="field__label">Asset ที่ใช้เทียบ</span><select class="field__input" name="assetId" data-reconciliation-assets required></select></label>
          <label class="field"><span class="field__label">ยอดปิดบัญชี</span><input class="field__input" name="closingCash" type="number" min="0" step="0.01" required /></label>
          <p class="field__error" role="alert" hidden></p>
        </div>
        <footer class="dialog__footer"><button class="button button--secondary" type="button" data-reconciliation-close>ยกเลิก</button>
          <button class="button" type="submit">ตรวจยอด</button></footer>
      </form>
    </dialog>

    <dialog class="dialog" data-goal-dialog aria-labelledby="goal-dialog-title"><form data-goal-form>
      <header class="dialog__header"><h2 id="goal-dialog-title" data-goal-dialog-title>เพิ่ม Goal</h2><button class="icon-button" type="button" data-goal-close aria-label="ปิด"><span data-icon="x"></span></button></header>
      <div class="dialog__body"><input name="id" type="hidden" />
        <label class="field"><span class="field__label">ชื่อเป้าหมาย</span><input class="field__input" name="name" required /></label>
        <label class="field"><span class="field__label">ยอดเป้าหมาย</span><input class="field__input" name="targetAmount" type="number" min="0.01" step="0.01" required /></label>
        <label class="field"><span class="field__label">ยอดเริ่มต้น</span><input class="field__input" name="currentAmount" type="number" min="0" step="0.01" required /></label>
        <label class="field"><span class="field__label">วันที่เป้าหมาย</span><input class="field__input" name="targetDate" type="date" required /></label>
        <label class="field"><span class="field__label">หมายเหตุ</span><input class="field__input" name="note" /></label><p class="field__error" role="alert" hidden></p></div>
      <footer class="dialog__footer"><button class="button button--secondary" type="button" data-goal-close>ยกเลิก</button><button class="button" type="submit">บันทึก</button></footer></form></dialog>

    <dialog class="dialog" data-contribution-dialog aria-labelledby="contribution-dialog-title"><form data-contribution-form>
      <header class="dialog__header"><h2 id="contribution-dialog-title" data-contribution-title>เพิ่มเงิน</h2><button class="icon-button" type="button" data-contribution-close aria-label="ปิด"><span data-icon="x"></span></button></header>
      <div class="dialog__body"><input name="goalId" type="hidden" /><p data-contribution-remaining></p>
        <label class="field"><span class="field__label">จำนวนเงิน</span><input class="field__input" name="amount" type="number" min="0.01" step="0.01" required /></label>
        <label class="field"><span class="field__label">วันที่</span><input class="field__input" name="contributionDate" type="date" required /></label>
        <label class="field"><span class="field__label">หมายเหตุ</span><input class="field__input" name="note" /></label><p class="field__error" role="alert" hidden></p></div>
      <footer class="dialog__footer"><button class="button button--secondary" type="button" data-contribution-close>ยกเลิก</button><button class="button" type="submit">เพิ่มเงิน</button></footer></form></dialog>

    <dialog class="dialog onboarding-dialog" data-onboarding-dialog aria-labelledby="onboarding-title"><form data-onboarding-form>
      <header class="dialog__header"><h2 id="onboarding-title">ตั้งค่าเริ่มต้น</h2><button class="icon-button" type="button" data-onboarding-close aria-label="ทำภายหลัง"><span data-icon="x"></span></button></header>
      <div class="dialog__body" data-onboarding-body></div>
      <p class="field__error onboarding-error" role="alert" hidden></p>
      <footer class="dialog__footer"><button class="button button--secondary onboarding-skip" type="button" data-onboarding-skip hidden>ยังไม่มีหนี้</button><button class="button" type="submit" data-onboarding-submit>ถัดไป</button></footer>
    </form></dialog>

    <dialog class="dialog quick-add-sheet" data-quick-add-dialog aria-labelledby="quick-add-title">
      <header class="dialog__header"><h2 id="quick-add-title">เพิ่มรายการ</h2><button class="icon-button" type="button" data-quick-add-close aria-label="ปิด"><span data-icon="x"></span></button></header>
      <div class="dialog__body quick-add-menu">
        <button type="button" data-quick-add="asset"><span data-icon="wallet-cards"></span><span>Asset</span></button>
        <button type="button" data-quick-add="liability"><span data-icon="landmark"></span><span>Liability</span></button>
        <button type="button" data-quick-add="transaction"><span data-icon="receipt-text"></span><span>Transaction</span></button>
        <button type="button" data-quick-add="goal"><span data-icon="goal"></span><span>Goal</span></button>
      </div>
    </dialog>

    <dialog class="dialog" data-more-dialog aria-labelledby="more-dialog-title">
      <header class="dialog__header">
        <h2 id="more-dialog-title">เมนูเพิ่มเติม</h2>
        <button class="icon-button" type="button" data-more-close aria-label="ปิด">
          <span data-icon="x"></span>
        </button>
      </header>
      <nav class="dialog__body more-menu" data-more-menu></nav>
    </dialog>

    <dialog class="dialog" data-confirm-dialog aria-labelledby="confirm-dialog-title">
      <form method="dialog">
        <header class="dialog__header">
          <h2 id="confirm-dialog-title" data-confirm-title>ยืนยันการทำรายการ</h2>
        </header>
        <div class="dialog__body">
          <p data-confirm-message></p>
        </div>
        <footer class="dialog__footer">
          <button class="button button--secondary" type="submit" value="cancel">ยกเลิก</button>
          <button class="button button--danger" type="submit" value="confirm" data-confirm-action>
            ยืนยัน
          </button>
        </footer>
      </form>
    </dialog>

    <div class="toast-region" aria-live="polite" aria-atomic="true" data-toast-region></div>
    <script src="config.js"></script>
    <script src="assets/vendor/supabase.umd.js"></script>
    <script src="assets/vendor/chart.umd.js"></script>
    <script type="module" src="js/app-loader.js"></script>
  </body>
</html>
